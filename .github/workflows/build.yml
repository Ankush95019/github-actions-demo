name: React Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Lint React App
      - name: Lint React App
        run: npm run lint

      # 5. Build React App
      - name: Build React App
        run: npm run build

      # 6. Upload Build Artifact
      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/dist

      # 7. Trigger Selenium Automation Repository
      - name: Trigger Selenium Automation Pipeline
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Ankush95019/selenium-automation-framework/dispatches \
            -d '{"event_type":"run-selenium"}'
